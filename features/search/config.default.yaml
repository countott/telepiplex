category_folder:
  - kind: live_action_movie
    name: 真人电影
    path: /真人电影
    plex_library_id: ""
  - kind: animated_movie
    name: 动画电影
    path: /动画电影
    plex_library_id: ""
  - kind: live_action_series
    name: 真人剧集
    path: /真人剧集
    plex_library_id: ""
  - kind: animated_series
    name: 动画剧集
    path: /动画剧集
    plex_library_id: ""
search:
  enable: true
  prowlarr:
    base_url: http://127.0.0.1:9696
    api_key: ""
    timeout: 200
    indexer_timeout: 75
    status_timeout: 15
    indexer_ids: "-2"
    first_wave_indexer_ids: []
    wave_delay: 1.5
    categories:
      movie: 2000
      tv: 5000
    result_limit: 12
  scoring:
    # 命中即排除，不再参与评分。
    reject_keywords: [720p, 576p, 480p, CAM, TS, TC, 枪版, 抢先, HC, HDTC, HDCAM]
    keyword_scores:
      "2160p": 100
      "1080p": 50
      "BluRay": 12
      "BDRip": 10
      "WEB": 6
      "Remux": -1
      "HEVC": 2
      "H.265": 2
      "x265": 2
      "H.264": 1
      "x264": 1
      "Atmos": 20
      "TrueHD": 4
      "DTS-HD": 3
      "EAC3": 2
      "国配": 2
      "中字": 1
    indexer_scores:
      "M-Team": 3
      "TorrentLeech": 1
metadata:
  wikipedia:
    enable: true
    languages: [zh, en]
    timeout: 10
    min_interval: 3
    max_queries: 2
    rate_limit_cooldown: 30
  douban:
    enable: true
    timeout: 10
    cache_ttl: 900
    max_concurrency: 2
    circuit_breaker_failures: 3
    circuit_breaker_seconds: 300
  tvdb:
    enable: true
    api_key: ""
    base_url: https://api4.thetvdb.com/v4
    subscriber_pin: ""
    timeout: 15
  tmdb:
    enable: true
    api_key: ""
    base_url: https://api.themoviedb.org/3
    timeout: 15
  anilist:
    enable: true
    endpoint: https://graphql.anilist.co
    timeout: 15
