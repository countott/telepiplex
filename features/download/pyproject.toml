[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telepiplex-download"
version = "2.1.2"
requires-python = ">=3.12"
dependencies = ["telepiplex-plugin-sdk==2.2.0", "requests>=2.32,<3", "PyYAML>=6.0.2", "qrcode>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
